[package]
name = "csgh-image-studio"
version = "3.0.52"
description = "呈尚策划 · 美工生图系统PRO"
authors = ["呈尚策划"]
edition = "2021"
default-run = "csgh-image-studio"

[lib]
name = "csgh_image_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "backend-gateway"
path = "src/gateway_bin/backend_gateway.rs"
required-features = ["gateway"]

[features]
default = ["tauri-commands"]
gateway = []
tauri-commands = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-shell", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots", "stream", "system-proxy"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
dotenvy = "0.15"
chrono = "0.4"
regex = "1.10"
uuid = { version = "1", features = ["v4"] }
aliyun-oss-rust-sdk = { version = "0.2.2", default-features = false, features = ["async"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 4
lto = "thin"
incremental = true
opt-level = "s"
strip = true
